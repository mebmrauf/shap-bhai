services:
  - type: web
    name: snake-arena
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/server.mjs
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL_POOLED
        sync: false
      - key: IP_HASH_SECRET
        sync: false

